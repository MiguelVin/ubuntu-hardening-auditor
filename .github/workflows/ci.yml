name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -v

  lab:
    # Builds the vulnerable container and checks that --fix really raises the score.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the lab
        run: docker compose -f lab/docker-compose.yml up -d --build
      - name: Audit, fix, audit again
        run: |
          docker exec hardaudit-lab hardaudit --format json > before.json || true
          docker exec hardaudit-lab hardaudit --fix --yes --no-hints || true
          docker exec hardaudit-lab hardaudit --format json > after.json || true
          python3 - <<'EOF'
          import json
          before = json.load(open("before.json"))["score"]
          after = json.load(open("after.json"))["score"]
          print(f"score {before} -> {after}")
          assert after > before, "--fix did not improve the score"
          EOF
      - name: Stop the lab
        if: always()
        run: docker compose -f lab/docker-compose.yml down

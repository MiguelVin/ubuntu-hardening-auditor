[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ubuntu-hardening-auditor"
version = "0.1.0"
description = "Security and hardening auditor for Ubuntu with a risk score and remediation commands."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "MiguelVin" }]
dependencies = ["rich>=13", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
hardaudit = "hardaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hardaudit = ["reports/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
